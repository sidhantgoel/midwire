# Read by /usr/lib/midwire/firstboot-network on the first boot.
# Change these here to build an image with different defaults.

# NetworkManager autoconnect priority of the midwire-hotspot profile. It no
# longer decides anything: the profile does not connect automatically, and
# /usr/lib/midwire/wifi-fallback starts the hotspot when no saved Wi-Fi
# network can be joined. Kept below the web UI's midwire-wifi (10) and
# Raspberry Pi Imager's profiles (0) in case someone switches autoconnect
# back on by hand.
HOTSPOT_PRIORITY=-10

# Hotspot password every device starts with (8 to 63 characters). The web
# UI's setup wizard asks the user to change it on the first login, and keeps
# a reminder up until they do: it compares the hotspot's password with this
# value. Empty means: generate a different one on every device instead and
# write it to /boot/firmware/midwire-hotspot.txt.
HOTSPOT_DEFAULT_PASSWORD=midwire-setup

# Two-letter Wi-Fi regulatory country (for example GB, US, IN), used when
# neither Raspberry Pi Imager nor midwire-hotspot.txt has set one. Empty
# means: leave it unset and keep the hotspot on 2.4 GHz channel 6.
WIFI_COUNTRY=

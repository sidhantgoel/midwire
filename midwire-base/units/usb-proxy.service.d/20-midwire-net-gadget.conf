# Added to usb-proxy.service by the midwire-base package.
#
# The USB-C port carries one gadget at a time. While the proxy is idle the
# port is a network adapter (midwire-net-gadget.service). This makes systemd
# take that down before the proxy starts, and bring it back afterwards.

[Unit]
Conflicts=midwire-net-gadget.service
# With Conflicts, this ordering means: stop the network gadget completely,
# then start the proxy.
After=midwire-net-gadget.service

[Service]
# Runs when the proxy has stopped for any reason: stopped from the page, the
# device unplugged, or a crash. "+" runs it as root; the proxy itself runs as
# usbproxy. Only if the network gadget is switched on (enabled).
ExecStopPost=+/bin/sh -c 'systemctl is-enabled --quiet midwire-net-gadget.service && systemctl start --no-block midwire-net-gadget.service || true'
